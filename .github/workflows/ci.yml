name: ci
on:
  push:
    branches:
      - master
  pull_request:

# Python versions: 3.10 is mach's minimum (MIN_PYTHON_VERSION in mozilla-central's
# `mach`), so developers may still run it. Production runs 3.11 (Debian 12 image).
#
# Poetry isn't pinned to production's version (2.1.1, from mozilla-central's
# taskcluster/docker/updatebot/privileged-setup.sh): 2.1.1 creates the virtualenv
# with its own interpreter rather than the one setup-python provides, so every
# matrix entry would test the same Python. The check step below guards against that.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install updatebot dependencies
        run: poetry install
      - name: Check poetry is using the matrix Python
        shell: bash
        run: poetry run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python-version }}', v"
  lint:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install updatebot dependencies
        run: poetry install
      - name: lint codebase
        run: poetry run flake8 --ignore=E501,E402,E275 .
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install updatebot dependencies
        run: poetry install
      - name: Check poetry is using the matrix Python
        shell: bash
        run: poetry run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python-version }}', v"
      - name: Create localconfig for test run
        run: cp localconfig.py.example localconfig.py
      - name: Start MySQL service
        run: sudo systemctl start mysql.service
      - name: Install arc and Mercurial as in the Docker image
        # setup_real_arc.py reads the recipe from Firefox's main branch. Mercurial is
        # built with the runner's Python, which needs its headers.
        run: |
          sudo apt-get update && sudo apt-get install -y php-cli php-curl python3-dev python3-venv
          /usr/bin/python3 tests/setup_real_arc.py "$RUNNER_TEMP/real-arc" --python /usr/bin/python3
          echo "$RUNNER_TEMP/real-arc/bin" >> "$GITHUB_PATH"
      - name: Test updatebot
        env:
          UPDATEBOT_REAL_ARC: required
        run: poetry run coverage run test.py
      - name: Generate coverage metrics
        run: poetry run coverage report
